<script>
let playerHP=120;
let enemyHP=120;
let busy=false;

function update(){
  document.getElementById("playerHP").textContent=playerHP+" / 120";
  document.getElementById("enemyHP").textContent=enemyHP+" / 120";
  document.getElementById("playerBar").style.width=(playerHP/120*100)+"%";
  document.getElementById("enemyBar").style.width=(enemyHP/120*100)+"%";
}

function message(text){
  document.getElementById("message").textContent=text;
}

function attack(move,damage){
  if(busy || playerHP<=0 || enemyHP<=0)return;

  busy=true;

  const player=document.getElementById("player");
  player.classList.remove("attack");
  void player.offsetWidth;
  player.classList.add("attack");

  enemyHP=Math.max(0,enemyHP-damage);
  update();

  message("⚡ Pikachu used "+move+"! "+damage+" damage!");

  if(enemyHP===0){
    message("🏆 Charizard fainted! YOU WIN!");
    busy=false;
    return;
  }

  setTimeout(enemyAttack,900);
}

function enemyAttack(){
  const damage=18;

  playerHP=Math.max(0,playerHP-damage);
  update();

  message("🔥 Charizard used Ember! "+damage+" damage!");

  if(playerHP===0){
    message("💀 Pikachu fainted! YOU LOSE!");
    return;
  }

  busy=false;
}

async function voiceCommand(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){
    message("❌ Speech recognition is not supported by this browser.");
    return;
  }

  message("🎤 Checking voice system...");

  try{

    /*
      Try on-device recognition first.
      This is only available in browsers that support
      the newer on-device Web Speech API.
    */

    if(
      typeof SpeechRecognition.available === "function" &&
      typeof SpeechRecognition.install === "function"
    ){

      let status =
        await SpeechRecognition.available({
          langs:["en-US"],
          processLocally:true,
          quality:"command"
        });

      if(status==="downloadable" || status==="downloading"){

        message("📥 Installing English voice pack...");

        const installed =
          await SpeechRecognition.install({
            langs:["en-US"],
            quality:"command"
          });

        if(!installed){
          message("❌ Voice language pack could not be installed.");
          return;
        }

        message("✅ Voice pack installed. Tap 🎤 again.");
        return;
      }

      if(status==="unavailable"){
        message("⚠️ On-device voice unavailable. Trying online recognition...");
      }
    }

    startRecognition(SpeechRecognition);

  }catch(error){

    message("⚠️ Voice setup error: "+error.name);

  }
}

function startRecognition(SpeechRecognition){

  const recognition=new SpeechRecognition();

  recognition.lang="en-US";
  recognition.continuous=false;
  recognition.interimResults=false;
  recognition.maxAlternatives=3;

  /*
    Try local processing if supported.
  */

  try{
    if("processLocally" in recognition){
      recognition.processLocally=true;
    }
  }catch(e){
    recognition.processLocally=false;
  }

  message("🎤 LISTENING... Say Thunderbolt!");

  recognition.onstart=function(){
    message("🎤 I'm listening...");
  };

  recognition.onspeechstart=function(){
    message("👂 I hear you...");
  };

  recognition.onresult=function(event){

    let text="";

    for(let i=0;i<event.results.length;i++){
      text += event.results[i][0].transcript+" ";
    }

    text=text.toLowerCase().trim();

    message("🗣️ Heard: "+text);

    if(
      text.includes("thunderbolt") ||
      text.includes("thunder bolt")
    ){
      setTimeout(()=>{
        attack("Thunderbolt",32);
      },500);
      return;
    }

    if(
      text.includes("quick attack") ||
      text.includes("quick")
    ){
      setTimeout(()=>{
        attack("Quick Attack",20);
      },500);
      return;
    }

    message("🤔 I heard \""+text+"\" but don't know that command.");
  };

  recognition.onerror=function(event){

    let error=event.error;

    if(error==="no-speech"){
      message("🔇 No speech detected. Tap 🎤 and speak again.");
    }
    else if(error==="not-allowed"){
      message("🚫 Microphone permission was denied.");
    }
    else if(error==="network"){
      message("🌐 Speech service/network error.");
    }
    else if(error==="language-not-supported"){
      message("🌐 English voice recognition isn't supported.");
    }
    else{
      message("⚠️ Voice error: "+error);
    }
  };

  recognition.onend=function(){
    console.log("Voice recognition ended.");
  };

  try{
    recognition.start();
  }catch(error){
    message("⚠️ Could not start microphone: "+error.name);
  }
}

function restart(){

  playerHP=120;
  enemyHP=120;
  busy=false;

  update();

  message(
    "Battle restarted! Say “Pikachu, use Thunderbolt!”"
  );
}

update();
</script>
